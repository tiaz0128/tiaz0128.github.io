{%- comment -%}
  howtodraw.cloud 다이어그램 임베드
  사용: {% include template/howtodraw.html src="https://howtodraw.cloud/d/<id>" height="600" %}
    src    : iframe 소스 (공개 /d/<id> 링크, 공유 #d= 링크, 또는 레포에 올린 내보내기 .html)
    height : 높이(px), 기본 560
    title  : 접근성용 제목 (선택)
{%- endcomment -%}
<div class="howtodraw-embed">
  <iframe src="{{ include.src }}"
          height="{{ include.height | default: 560 }}"
          title="{{ include.title | default: 'howtodraw.cloud diagram' }}"
          loading="lazy" frameborder="0"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
