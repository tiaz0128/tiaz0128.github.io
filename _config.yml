# Contact links
email: tiaz0128.dev@gmail.com # Add your Email address
phone: # Add your Phone number
website: tiaz.dev # Add your website, do not add http://
linkedin: tiaz0128 # Add your Linkedin handle
github: tiaz0128 # Add your Github handle
youtube: tiaz0128 # Add your Youtube handle
twitter:  # Add your Twitter handle
facebook: # Add your Facebook handle
instagram: tiaz.dev
pinterest: # Add your Pinterest handle

# Build settings
markdown:       kramdown
highlighter:    rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# 글 날짜는 한국 시간 기준으로 적는다. UTC로 두면 오늘 날짜로 쓴 글이
# 한국시간 09:00(UTC 자정) 전까지 "future date"로 빌드에서 제외된다.
timezone: Asia/Seoul

# 추가 포스트 설정
# collections:
#   seminars:
#     output: true

# 글의 영어판. _posts/<경로>.md 의 짝이 _en/<같은 경로>.md 이고, 따로 페이지를
# 내지 않고 한국어 글 페이지 안에 함께 실린다(component/en-of.html, 한영 스위치).
collections:
  en:
    output: false

include:
  - _pages

# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jemoji #Uncomment this to allow emoji in your post
  - jekyll-spaceship

# jekyll-spaceship
# mathjax-processor의 기본 src에 polyfill.io가 하드코딩되어 있으나,
# 해당 도메인은 2024년 공급망 공격 이후 압류되어 현재 응답하지 않는다.
# (es6 폴리필은 IE11용이라 현재는 불필요) src 배열은 병합이 아닌 교체로 동작한다.
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Permalinks
# paginate: 5  — 글 목록은 한 페이지에 다 싣고 칩으로 거른다(_layouts/home.html, 2026-09-30)

# Excludes
exclude: [ Gemfile, Gemfile.lock, tale.gemspec ]

host: "0.0.0.0"
livereload: true
reload_port: 5678
