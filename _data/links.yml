# 프로필 링크 — linktr.ee/tiaz.dev 를 대신한다. 위에서부터 그대로 그려진다.
#
# category:  구역 제목
# note:      구역 제목 아래 회색 한 줄 (선택)
# ongoing:   note 아래에 서는 알약 한 줄 (선택). "이 구역은 아직 안 끝났다"를
#            말하는 자리다 — 목록이 짧아 보이는 것과 목록이 죽은 것은 다르고,
#            읽는 쪽에서는 구별이 안 된다. 줄마다 붙는 날짜(_data/resources.yml
#            의 date)가 "언제 손봤나"를 말하고 이쪽이 "계속 는다"를 말한다.
# source:    'resources' 를 주면 _data/resources.yml 을 자동으로 채운다.
#            줄은 전부 같은 꼴이다. 요약본을 추가할 때 이 파일은
#            건드리지 않아도 된다.
# sample:    구역 맨 위에 걸리는 샘플. 문서마다 거는 표지가 아니라
#            "요약본이 이렇게 생겼다"를 보이는 한 장이라, 새 문서를
#            넣어도 따라 바뀌지 않는다. 바꾸고 싶을 때만 바꾼다.
#            shot.py 가 구운 <slug>-cover.webp 를 그대로 쓰면 된다.
# sample_video:  있으면 이게 대신 서고 sample 은 poster 로 내려간다.
#            요약본의 값은 종이가 아니라 움직인다는 데 있어서 정지
#            사진으로는 그게 안 전해진다. 소리 없이 저 혼자 돈다.
#            assets/video/ 에 두고 짧게(5~10초) · 작게 자를 것 —
#            자동재생이라 첫 화면에서 그대로 내려받는다.
#            .mp4 를 기본으로. type 은 확장자에서 따간다.
# sample_note:   샘플 아래 회색 한 줄. 없으면 "샘플 · 요약본 1페이지".
# *_en · *_ja · *_zh · *_es · *_it · *_fr: category · note · ongoing · sample_note · links[].label · note 의 말별 문구
#            (component/tr-of.html). 없는 말은 영어가, 영어도 없으면 한국어가 선다.
# links[].icon:  component/link-icon.html 이 아는 이름
#                web youtube linkedin instagram github aws diagram article sheet quiz
#                (없거나 모르는 이름이면 사슬 아이콘)
# links[].logo:   아이콘 대신 쓸 이미지 경로. icon 보다 우선한다.
# display:  'icons' 를 주면 줄 대신 아이콘만 한 줄로 세운다.
#           라벨이 사라지므로 title/aria-label 로만 남는다 —
#           이름 없이도 알아볼 아이콘이 있는 구역에만 쓸 것.

