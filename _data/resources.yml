# 치트 시트 카탈로그. 문서 자체는 resources/<slug>.html 에 있는 통짜 정적
# 파일이고, 이 파일은 그 목록을 만든다.
#
# 새 문서 넣는 순서
#   1. resources/<slug>.html 에 통짜 HTML 을 넣는다 (프런트매터 없이).
#      slug 는 파일 이름 그대로다 — 소문자 하이픈. /link 가 여기서
#      /resources/<slug>.html 과 .pdf 링크를 그대로 만들어 낸다.
#   2. cd script && uv run shot.py <slug>
#      -> 표지 미리보기, 배포용 PDF, 서비스 아이콘이 한 번에 만들어진다.
#      새로 깐 WSL 이면 chromium 이 라이브러리가 없어 못 뜬다. 한 번만:
#        sudo npx playwright install-deps chromium
#   3. 이 파일 맨 위에 항목을 추가한다. date 가 최신인 것이 표지를 갖는다.
#      title/summary 는 문서 표지에 박힌 것과 같게. 옛 항목을 고쳐 쓰는
#      거라면 slug·title·cover 를 전부 새 것으로 바꿨는지 볼 것 —
#      cover 만 옛 파일에 남아 있어도 목록은 옛 표지를 계속 보여준다.
#   4. 배포. master 에 올리면 .github/workflows/jekyll.yml 이 빌드해서
#      GitHub Pages 로 내보낸다. 다른 절차는 없다.
#
#        git add resources/<slug>.html resources/<slug>.pdf \
#                assets/img/resources/<slug>-cover.webp \
#                _data/resources.yml _data/service_icons.yml
#        git commit && git push origin master
#
#      PDF 는 구운 물건이지만 빌드 산출물이 아니라 저장소에 같이 들어간다.
#      받기 버튼이 그 파일을 그대로 주기 때문에, 없으면 404 다.
#      문서를 갈아치웠다면 옛 slug 의 html·pdf·cover 를 git rm 한다.
#      프런트매터가 없어 Jekyll 이 그냥 복사하는 파일이라, 항목만 지우면
#      목록에서만 빠지고 옛 URL 은 계속 열린다.
#      배포가 반영이 안 되면 나온 페이지의 generator 메타를 본다.
#      Jekyll v3.10.0 이면 워크플로가 아니라 레거시 Pages 빌드가 돈 것이다.
#
# 왜 컬렉션(_resources/)이 아닌가:
#   컬렉션 문서는 Jekyll::Document라서 jekyll-spaceship의 8개 프로세서가
#   전부 달라붙는다(:documents, pre_render/post_render). 문서 하나가 660KB짜리
#   base64 영상 덩어리라 Nokogiri 파싱과 정규식 스캔에서 빌드가 몇 분씩 멈춘다.
#   render_with_liquid: false 로는 Liquid만 꺼지고 spaceship은 못 막는다.
#   프런트매터가 없으면 Jekyll은 StaticFile로 보고 그냥 복사한다 — 처리 0.
#
# cover:  문서 1페이지를 실제로 렌더한 이미지. 손으로 만들지 말고
#         `cd script && uv run shot.py <slug>` 로 굽는다.
# kind:    cheatsheet | exam — services 가 비었을 때 쓰는 기본 아이콘이 갈린다.
# services: 이 문서가 다루는 AWS 서비스들. assets/json/icons/aws.json 의 키.
#           표지가 걸린 첫 장은 아래에 전부 늘어놓고, 한 줄짜리 목록은
#           첫 번째 것을 제 아이콘으로 쓴다.
#           shot.py 가 쓰인 것만 골라 _data/service_icons.yml 로 뽑아둔다
#           (원본이 2.5MB라 통째로 못 읽는다).
#           비워두면 일반 문서 아이콘으로 떨어진다.
#
#           ★ 한 문서 안에서는 같은 계열로 고를 것. aws.json 에는 색 사각형
#             (Architecture)과 선화(Resource) 두 계열이 섞여 있어서, 같이
#             걸면 크기를 아무리 맞춰도 따로 논다. 이름이 리소스를 가리키는
#             쪽(amazon_ec2_instance)이 대개 선화다.
